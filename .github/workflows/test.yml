name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -S warning deploy.sh tests/integration.sh

  integration:
    # Полный сценарий deploy/rollback/healthcheck против sshd, поднятого на самом раннере.
    needs: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server rsync
      - run: bash tests/integration.sh
